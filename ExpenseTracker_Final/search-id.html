<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search by ID | ExpenseTracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="page-container">
    <h1 class="page-title">Search by ID</h1>
    <p class="page-subtitle">Uses <strong>Binary Search</strong> &mdash; records are sorted by ID first, then the search interval is halved each step. Time Complexity: O(log n).</p>

    <div class="form-card">
        <form id="searchIdForm" novalidate>
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="searchIdInput">Expense ID</label>
                    <input type="number" id="searchIdInput" name="searchIdInput" placeholder="e.g., 3" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        <div class="perf-note" id="searchStats" style="display:inline-block;margin-top:16px;"></div>
        <div id="searchResultsContainer"></div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
