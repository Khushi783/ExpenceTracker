<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Expenses | ExpenseTracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="page-container">
    <h1 class="page-title">View All Expenses</h1>
    <p class="page-subtitle">Every expense you've recorded, in one place.</p>

    <div class="table-toolbar">
        <span class="table-count" id="tableCount">0 records</span>
        <a href="add-expense.html" class="btn btn-primary">+ Add Expense</a>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <table class="expense-table">
            <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Category</th><th>Amount</th><th>Date</th><th>Description</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
        </table>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">&#128203;</div>
        <p>No expenses recorded yet.</p>
        <a href="add-expense.html" class="btn btn-primary mt-16">Add Your First Expense</a>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/viewExpense.js"></script>
</body>
</html>
