<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search by Category | ExpenseTracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="page-container">
    <h1 class="page-title">Search by Category</h1>
    <p class="page-subtitle">Uses <strong>Linear Search</strong> &mdash; scans every record checking for a category match. Time Complexity: O(n).</p>

    <div class="form-card">
        <form id="searchCategoryForm" novalidate>
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="searchCategoryInput">Category</label>
                    <select id="searchCategoryInput" name="searchCategoryInput" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        <div class="perf-note" id="searchStats" style="display:inline-block;margin-top:16px;"></div>
        <div id="searchResultsContainer"></div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
