<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort Expenses | ExpenseTracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="page-container">
    <h1 class="page-title">Sort Expenses</h1>
    <p class="page-subtitle">Choose a sorting algorithm and a field to sort by, then compare their execution time.</p>

    <div class="form-card">
        <form id="sortForm" novalidate>
            <label style="font-size:13px;font-weight:600;color:var(--dark-blue);display:block;margin-bottom:8px;">Algorithm</label>
            <div class="pill-options">
                <div class="pill-option"><input type="radio" name="sortAlgo" id="algoBubble" value="bubble" checked><label for="algoBubble">Bubble Sort</label></div>
                <div class="pill-option"><input type="radio" name="sortAlgo" id="algoSelection" value="selection"><label for="algoSelection">Selection Sort</label></div>
                <div class="pill-option"><input type="radio" name="sortAlgo" id="algoInsertion" value="insertion"><label for="algoInsertion">Insertion Sort</label></div>
                <div class="pill-option"><input type="radio" name="sortAlgo" id="algoMerge" value="merge"><label for="algoMerge">Merge Sort</label></div>
                <div class="pill-option"><input type="radio" name="sortAlgo" id="algoQuick" value="quick"><label for="algoQuick">Quick Sort</label></div>
            </div>

            <label style="font-size:13px;font-weight:600;color:var(--dark-blue);display:block;margin-bottom:8px;">Sort By Field</label>
            <div class="pill-options">
                <div class="pill-option"><input type="radio" name="sortField" id="fieldName" value="name" checked><label for="fieldName">Name</label></div>
                <div class="pill-option"><input type="radio" name="sortField" id="fieldAmount" value="amount"><label for="fieldAmount">Amount</label></div>
                <div class="pill-option"><input type="radio" name="sortField" id="fieldDate" value="date"><label for="fieldDate">Date</label></div>
                <div class="pill-option"><input type="radio" name="sortField" id="fieldId" value="id"><label for="fieldId">Expense ID</label></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Run Sort</button>
            </div>
        </form>

        <div class="perf-note" id="sortStats" style="display:none;margin-top:18px;"></div>
    </div>

    <div id="sortResultsSection" class="mt-24" style="display:none;">
        <div class="table-wrapper">
            <table class="expense-table">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Category</th><th>Amount</th><th>Date</th><th>Description</th><th>Actions</th></tr>
                </thead>
                <tbody id="sortResultTableBody"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/viewExpense.js"></script>
<script src="js/sorting.js"></script>
</body>
</html>
