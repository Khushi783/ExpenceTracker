<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics | ExpenseTracker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="page-container">
    <h1 class="page-title">Full Statistics</h1>
    <p class="page-subtitle">A complete breakdown of your expense data.</p>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Expense</div><div class="stat-value" id="fullStatTotal">&#8377;0.00</div></div>
        <div class="stat-card accent-green"><div class="stat-label">Average Expense</div><div class="stat-value" id="fullStatAverage">&#8377;0.00</div></div>
        <div class="stat-card accent-amber"><div class="stat-label">Maximum Expense</div><div class="stat-value" id="fullStatMax">&#8377;0.00</div></div>
        <div class="stat-card accent-red"><div class="stat-label">Minimum Expense</div><div class="stat-value" id="fullStatMin">&#8377;0.00</div></div>
        <div class="stat-card"><div class="stat-label">Total Transactions</div><div class="stat-value" id="fullStatCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Highest Category</div><div class="stat-value" id="fullStatHighestCategory">-</div></div>
        <div class="stat-card"><div class="stat-label">Lowest Category</div><div class="stat-value" id="fullStatLowestCategory">-</div></div>
    </div>

    <h2 class="page-title" style="font-size:20px;">Category Analysis</h2>
    <div class="card mt-16" style="margin-bottom:32px;">
        <div id="fullStatCategoryBreakdown"></div>
    </div>

    <h2 class="page-title" style="font-size:20px;">Monthly Analysis</h2>
    <div class="card mt-16">
        <div id="fullStatMonthlyBreakdown"></div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/reports.js"></script>
<script src="js/statistics.js"></script>
</body>
</html>
